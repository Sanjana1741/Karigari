<!DOCTYPE html>
<html lang="en" data-contrast="normal" data-hover="off" data-size="md">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Karigari — Local Hands, Global Reach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#E8E1CF;
    --card:#F4EFE2;
    --ink:#262220;
    --ink-soft:#5B5348;
    --indigo:#2E4057;
    --indigo-dark:#1F2D3D;
    --madder:#A8402F;
    --turmeric:#C9962C;
    --thread:#C9BFA4;
    --thread-line:#B9AE93;
    --focus:#1F2D3D;
    --radius:4px;
    --shadow:0 2px 0 rgba(38,34,32,0.12);
    --font-display:'Fraunces', serif;
    --font-body:'Work Sans', sans-serif;
    --font-mono:'IBM Plex Mono', monospace;
  }
  html[data-size="sm"]{ font-size:15px; }
  html[data-size="md"]{ font-size:17px; }
  html[data-size="lg"]{ font-size:20px; }
  html[data-size="xl"]{ font-size:24px; }

  html[data-contrast="high"]{
    --paper:#000000;
    --card:#0A0A0A;
    --ink:#FFFFFF;
    --ink-soft:#F4E24A;
    --indigo:#FFD400;
    --indigo-dark:#FFD400;
    --madder:#FF5A3C;
    --turmeric:#FFD400;
    --thread:#FFFFFF;
    --thread-line:#FFFFFF;
    --focus:#FFD400;
    --shadow:none;
  }

  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--paper); color:var(--ink); font-family:var(--font-body); transition:background .2s, color .2s; }
  h1,h2,h3{ font-family:var(--font-display); margin:0; letter-spacing:-0.01em; }
  p{ margin:0; }
  button, input, select, textarea{ font-family:inherit; font-size:1rem; color:inherit; }
  button{ cursor:pointer; }
  a{ color:var(--indigo); }
  :focus-visible{ outline:3px solid var(--focus); outline-offset:2px; }

  html[data-hover="on"] button:hover, html[data-hover="on"] a:hover, html[data-hover="on"] .card:hover, html[data-hover="on"] .icon-btn:hover, html[data-hover="on"] select:hover, html[data-hover="on"] .toggle-row:hover{
    outline:3px solid var(--turmeric); outline-offset:2px; background:rgba(201,150,44,0.15) !important;
  }

  .app{ min-height:100vh; display:flex; flex-direction:column; }
  .hidden{ display:none !important; }

  /* ---------- Stamp mark (signature element) ---------- */
  .stamp{ display:inline-block; }
  .stamp svg{ display:block; }
  .stamp-press{ animation: press 900ms ease; }
  @keyframes press{
    0%{ transform:scale(1.6) rotate(-8deg); opacity:0; }
    40%{ transform:scale(0.94) rotate(2deg); opacity:1; }
    60%{ transform:scale(1.05) rotate(-1deg); }
    100%{ transform:scale(1) rotate(0deg); }
  }

  /* ---------- Landing ---------- */
  .landing{ flex:1; display:flex; flex-direction:column; }
  .landing-top{ display:flex; align-items:center; gap:0.6rem; padding:1.4rem 1.6rem; }
  .brand{ display:flex; align-items:center; gap:0.6rem; }
  .brand-name{ font-family:var(--font-display); font-weight:700; font-size:1.3rem; }
  .landing-main{ flex:1; display:flex; align-items:center; justify-content:center; padding:2rem 1.6rem 3rem; }
  .thesis-wrap{ max-width:640px; text-align:left; }
  .eyebrow{ font-family:var(--font-mono); text-transform:uppercase; letter-spacing:0.12em; font-size:0.75rem; color:var(--madder); margin-bottom:0.9rem; display:block; }
  .thesis{ font-size:clamp(1.8rem, 5vw, 2.8rem); line-height:1.15; font-weight:600; }
  .thesis em{ font-style:italic; color:var(--indigo); }
  .thesis-sub{ margin-top:1.1rem; color:var(--ink-soft); font-size:1.05rem; line-height:1.5; max-width:52ch; }
  .cta-row{ margin-top:2rem; display:flex; gap:0.8rem; flex-wrap:wrap; }

  .btn{ border:2px solid var(--ink); border-radius:var(--radius); padding:0.75rem 1.4rem; font-weight:600; background:transparent; box-shadow:var(--shadow); }
  .btn-primary{ background:var(--indigo); color:#fff; border-color:var(--indigo-dark); }
  html[data-contrast="high"] .btn-primary{ color:#000; }
  .btn-primary:active{ transform:translateY(1px); }
  .btn-ghost{ background:transparent; }
  .btn-lg{ padding:0.95rem 1.8rem; font-size:1.05rem; }
  .btn-stamp{ display:inline-flex; align-items:center; gap:0.6rem; }

  /* ---------- Forms ---------- */
  .form-screen{ flex:1; display:flex; align-items:center; justify-content:center; padding:2rem 1.2rem; }
  .form-card{ width:100%; max-width:440px; background:var(--card); border:2px solid var(--ink); border-radius:6px; padding:2rem; box-shadow:var(--shadow); }
  .form-card h2{ font-size:1.6rem; margin-bottom:0.3rem; }
  .form-card .form-sub{ color:var(--ink-soft); font-size:0.92rem; margin-bottom:1.4rem; }
  .field{ margin-bottom:1.1rem; }
  .field label{ display:block; font-family:var(--font-mono); font-size:0.75rem; text-transform:uppercase; letter-spacing:0.06em; margin-bottom:0.35rem; color:var(--ink-soft); }
  .field input, .field select{ width:100%; padding:0.65rem 0.7rem; border:2px solid var(--thread-line); border-radius:var(--radius); background:var(--paper); color:var(--ink); }
  .field .hint{ font-size:0.78rem; color:var(--ink-soft); margin-top:0.3rem; }
  .form-actions{ margin-top:1.4rem; display:flex; flex-direction:column; gap:0.7rem; }
  .switch-line{ text-align:center; font-size:0.9rem; color:var(--ink-soft); }
  .form-error{ background:rgba(168,64,47,0.12); border:1px solid var(--madder); color:var(--madder); padding:0.6rem 0.8rem; border-radius:var(--radius); font-size:0.88rem; margin-bottom:1rem; }
  html[data-contrast="high"] .form-error{ color:var(--ink); }

  /* ---------- App shell ---------- */
  .topbar{ display:flex; align-items:center; justify-content:space-between; padding:1rem 1.6rem; border-bottom:2px solid var(--ink); }
  .top-right{ display:flex; align-items:center; gap:0.7rem; position:relative; }
  .icon-btn{ width:2.6rem; height:2.6rem; border-radius:50%; border:2px solid var(--ink); background:var(--card); display:flex; align-items:center; justify-content:center; }
  .icon-btn svg{ width:1.3rem; height:1.3rem; }

  .panel{ position:absolute; top:3.2rem; right:0; width:280px; background:var(--card); border:2px solid var(--ink); border-radius:6px; box-shadow:0 6px 0 rgba(38,34,32,0.14); padding:1rem; z-index:30; }
  .panel h3{ font-size:0.78rem; font-family:var(--font-mono); text-transform:uppercase; letter-spacing:0.06em; color:var(--ink-soft); margin-bottom:0.7rem; }
  .toggle-row{ display:flex; align-items:center; justify-content:space-between; padding:0.55rem 0.3rem; border-radius:var(--radius); }
  .toggle-row + .toggle-row{ border-top:1px solid var(--thread-line); }
  .switch{ width:2.6rem; height:1.5rem; border-radius:1rem; border:2px solid var(--ink); background:var(--paper); position:relative; flex-shrink:0; }
  .switch .dot{ position:absolute; top:1px; left:1px; width:1rem; height:1rem; border-radius:50%; background:var(--ink); transition:left .15s; }
  .switch.on{ background:var(--indigo); }
  .switch.on .dot{ left:calc(100% - 1.15rem); background:#fff; }
  html[data-contrast="high"] .switch.on .dot{ background:#000; }
  .size-row{ display:flex; gap:0.4rem; margin-top:0.4rem; }
  .size-btn{ flex:1; border:2px solid var(--ink); background:var(--paper); border-radius:var(--radius); padding:0.3rem 0; font-family:var(--font-mono); font-size:0.8rem; }
  .size-btn.active{ background:var(--indigo); color:#fff; }
  html[data-contrast="high"] .size-btn.active{ color:#000; }
  .panel select{ width:100%; padding:0.5rem; border:2px solid var(--thread-line); border-radius:var(--radius); background:var(--paper); margin-top:0.3rem; }
  .panel-section{ margin-bottom:1rem; }
  .panel-section:last-child{ margin-bottom:0; }

  main.body{ flex:1; padding:2rem 1.6rem 3rem; max-width:960px; margin:0 auto; width:100%; }
  .greet{ font-size:1.7rem; margin-bottom:0.2rem; }
  .greet-sub{ color:var(--ink-soft); margin-bottom:1.6rem; }
  .action-row{ display:flex; gap:0.8rem; flex-wrap:wrap; margin-bottom:2rem; }

  .gallery-title{ display:flex; align-items:center; gap:0.6rem; font-size:1.1rem; font-family:var(--font-mono); text-transform:uppercase; letter-spacing:0.06em; color:var(--ink-soft); margin-bottom:1rem; }
  .gallery-title .rule{ flex:1; height:1px; background:var(--thread-line); }
  .gallery{ display:grid; grid-template-columns:repeat(auto-fill, minmax(210px,1fr)); gap:1.1rem; }
  .card{ background:var(--card); border:2px solid var(--ink); border-radius:6px; overflow:hidden; box-shadow:var(--shadow); }
  .card img{ width:100%; height:150px; object-fit:cover; display:block; border-bottom:2px solid var(--ink); }
  .card-body{ padding:0.8rem; }
  .card-cat{ font-family:var(--font-mono); font-size:0.7rem; text-transform:uppercase; color:var(--madder); }
  .card-desc{ font-size:0.88rem; margin-top:0.25rem; color:var(--ink-soft); line-height:1.4; }
  .card-price{ margin-top:0.5rem; font-weight:700; font-family:var(--font-mono); }

  .empty-state{ border:2px dashed var(--thread-line); border-radius:6px; padding:2.4rem 1.5rem; text-align:center; color:var(--ink-soft); }
  .empty-state .stamp{ margin-bottom:0.8rem; }

  /* ---------- Upload flow ---------- */
  .upload-screen{ max-width:560px; margin:0 auto; }
  .dropzone{ border:2px dashed var(--thread-line); border-radius:6px; padding:2.2rem 1.2rem; text-align:center; cursor:pointer; background:var(--card); }
  .dropzone:hover{ border-color:var(--indigo); }
  .preview-wrap{ text-align:center; margin-bottom:1.2rem; }
  .preview-wrap img{ max-width:100%; max-height:260px; border:2px solid var(--ink); border-radius:6px; }
  .ai-status{ display:flex; align-items:center; gap:0.6rem; font-family:var(--font-mono); font-size:0.85rem; color:var(--indigo); margin:0.9rem 0; }
  .spinner{ width:1rem; height:1rem; border:2px solid var(--thread-line); border-top-color:var(--indigo); border-radius:50%; animation:spin 0.8s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  textarea{ width:100%; padding:0.65rem 0.7rem; border:2px solid var(--thread-line); border-radius:var(--radius); background:var(--paper); color:var(--ink); resize:vertical; min-height:5rem; }

  /* ---------- Thank you ---------- */
  .thankyou{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:2rem; }
  .thankyou h2{ font-size:2rem; margin-top:1.2rem; }
  .thankyou p{ color:var(--ink-soft); margin-top:0.5rem; max-width:40ch; }

  .footer-note{ text-align:center; color:var(--ink-soft); font-size:0.8rem; padding:1rem; font-family:var(--font-mono); }
  .sr-only{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0); }
</style>
</head>

/* ============================= Storage helpers ============================= */
async function storeGet(key){
  try{
    if (window.storage && typeof window.storage.get === 'function') {
      const r = await window.storage.get(key, false);
      return r ? JSON.parse(r.value) : null;
    }
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : null;
  }catch(e){
    try {
      const raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : null;
    } catch (fallbackError) {
      console.error('storage get failed', fallbackError);
      return null;
    }
  }
}
async function storeSet(key, value){
  try{
    if (window.storage && typeof window.storage.set === 'function') {
      await window.storage.set(key, JSON.stringify(value), false);
      return;
    }
    localStorage.setItem(key, JSON.stringify(value));
  }catch(e){
    try {
      localStorage.setItem(key, JSON.stringify(value));
    } catch (fallbackError) {
      console.error('storage set failed', fallbackError);
    }
  }
}

/* ============================= Speech ============================= */
function speak(text){
  if(!state.tts || !text) return;
  try{
    if (!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.rate = 0.95;
    u.pitch = 1;
    u.lang = navigator.language || 'en-US';
    window.speechSynthesis.speak(u);
  }catch(e){}
}
function ttsAttrs(text){
  if(!state.tts) return '';
  const safe = JSON.stringify(text).replace(/"/g,'&quot;');
  return `onclick="speak(${safe})" data-tts="${safe.replace(/&quot;/g,'&quot;')}" tabindex="0" style="cursor:pointer" aria-label="Read aloud: ${text}" title="Read aloud"`;
}

  document.querySelectorAll('[data-tts]').forEach(el => {
    el.onclick = (event) => {
      event.stopPropagation();
      const text = el.getAttribute('data-tts');
      if (text) speak(text.replace(/&quot;/g, '"').replace(/^"|"$/g, ''));
    };
  });
}
async function processProductUpload(event) {
    const file = event.target ? event.target.files[0] : event;
    if (!file) return;

    // 1. Immediately create a local image preview URL
    const imagePreviewUrl = URL.createObjectURL(file);

    // 2. Set loading state and save initial preview
    if (typeof state !== 'undefined') {
        state.aiStatus = 'loading';
        state.pending = {
            title: 'Generating with AI...',
            category: 'Analyzing...',
            description: 'Analyzing your handcrafted product image...',
            previewUrl: imagePreviewUrl
        };
        if (typeof render === 'function') render();
    }

    // 3. Prepare image payload for FastAPI backend
    const formData = new FormData();
    formData.append('file', file);

    try {
        // Send request to backend (using full URL to prevent file:// protocol errors)
        const response = await fetch('http://localhost:8000/api/analyze-product', {
            method: 'POST',
            body: formData
        });

        if (!response.ok) {
            const errorData = await response.json();
            throw new Error(errorData.detail || 'Failed to analyze product');
        }

        const data = await response.json();

        // 4. Update state with AI-generated results
        if (typeof state !== 'undefined') {
            state.aiStatus = 'done';
            state.pending = {
                title: data.product_title || 'Handcrafted Artisan Item',
                category: data.category || 'Crafts',
                description: `${data.amazon_description}\n\nKey Details:\n- Materials: ${(data.materials || []).join(', ')}\n- Colors: ${(data.color_palette || []).join(', ')}`,
                previewUrl: imagePreviewUrl
            };
            if (typeof render === 'function') render();
        }

    } catch (error) {
        console.error("AI Analysis Error:", error);
        if (typeof state !== 'undefined') {
            state.aiStatus = 'error';
            state.pending = {
                title: 'Analysis Failed',
                category: 'Error',
                description: 'Could not generate AI description. Make sure main.py is running on port 8000.',
                previewUrl: imagePreviewUrl
            };
            if (typeof render === 'function') render();
        }
        alert("Backend connection failed: " + error.message);
    }
}

/* ============================= Auth handlers ============================= */
async function handleSignup(e){
  e.preventDefault();
  const name = document.getElementById('su-name').value.trim();
  const dob = document.getElementById('su-dob').value;
  const contact = document.getElementById('su-contact').value.trim();
  const udid = document.getElementById('su-udid').value.trim();
  const gender = document.getElementById('su-gender').value;
  if(!name || !dob || !contact || !gender){ setState({formError:t('fillRequired')}); return false; }
  const email = contact.includes('@') ? contact.toLowerCase() : contact;
  const user = {name, dob, contact, udid, gender, email};
  await storeSet('user:'+email, user);
  await storeSet('products:'+email, []);
  setState({user, products:[], view:'home', formError:''});
  return false;
}

async function handleLogin(e){
  e.preventDefault();
  const name = document.getElementById('li-name').value.trim();
  const email = document.getElementById('li-email').value.trim().toLowerCase();
  const user = await storeGet('user:'+email);
  if(!user || user.name.trim().toLowerCase() !== name.toLowerCase()){
    setState({formError:t('noAccount')});
    return false;
  }
  const products = await storeGet('products:'+email) || [];
  setState({user, products, view:'home', formError:''});
  return false;
}

function handleLogout(){
  setState({user:null, products:[], view:'landing', panelOpen:false});
}

/* ============================= Upload + AI handlers ============================= */
function fileToDataUrl(file){
  return new Promise((resolve,reject)=>{
    const r = new FileReader();
    r.onload = ()=>resolve(r.result);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}

async function handleFileSelect(e){
  const file = e.target.files[0];
  if(!file) return;
  if (!ANTHROPIC_API_KEY || ANTHROPIC_API_KEY === 'PASTE_YOUR_ANTHROPIC_API_KEY_HERE') {
    setState({aiStatus:'error'});
    alert('Add your Anthropic API key in the script before using AI product descriptions.');
    return;
  }
  const dataUrl = await fileToDataUrl(file);
  setState({pending:{dataUrl, mimeType:file.type, category:'', description:''}, aiStatus:'loading', view:'upload'});
  try{
    const base64 = dataUrl.split(',')[1];
    const langNames = {en:'English',hi:'Hindi',kn:'Kannada',ta:'Tamil',te:'Telugu',ml:'Malayalam'};
    const resp = await fetch("https://api.anthropic.com/v1/messages", {
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "x-api-key": ANTHROPIC_API_KEY,
        "anthropic-version": "2023-06-01"
      },
      body: JSON.stringify({
        model:"claude-sonnet-4-6",
        max_tokens:1000,
        messages:[{
          role:"user",
          content:[
            {type:"image", source:{type:"base64", media_type: file.type || "image/jpeg", data: base64}},
            {type:"text", text:`You are helping an artisan list a handmade product online. Look at the photo and respond with ONLY a JSON object, no preamble, no markdown fences, in this exact shape: {"category":"short product category, 2-4 words","description":"a warm, honest 1-2 sentence marketplace description of the product a buyer would see"}. Write the category and description in ${langNames[state.lang]}.`}
          ]
        }]
      })
    });
    if(!resp.ok){
      throw new Error(`AI request failed with status ${resp.status}`);
    }
    const data = await resp.json();
    const text = (data.content||[]).map(b=>b.text||'').join('').replace(/```json|```/g,'').trim();
    const parsed = JSON.parse(text);
    setState({pending:{...state.pending, category:parsed.category||'', description:parsed.description||''}, aiStatus:'done'});
  }catch(err){
    console.error('AI categorize failed', err);
    setState({aiStatus:'error'});
  }
}

async function handleSaveProduct(e){
  e.preventDefault();
  const category = document.getElementById('up-cat').value.trim();
  const description = document.getElementById('up-desc').value.trim();
  const price = document.getElementById('up-price').value;
  const product = {id: Date.now(), dataUrl: state.pending.dataUrl, category, description, price};
  const products = [product, ...state.products];
  if(state.user){ await storeSet('products:'+state.user.email, products); }
  setState({products, pending:null, view:'thankyou'});
  return false;
}
