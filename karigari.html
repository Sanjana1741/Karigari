<!DOCTYPE html>
<html lang="en" data-contrast="normal" data-hover="off" data-size="md">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Karigari — Local Hands, Global Reach</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --paper: #E8E1CF;
      --card: #F4EFE2;
      --ink: #262220;
      --ink-soft: #5B5348;
      --indigo: #2E4057;
      --indigo-dark: #1F2D3D;
      --madder: #A8402F;
      --turmeric: #C9962C;
      --green: #2F6B4F;
      --thread: #C9BFA4;
      --thread-line: #B9AE93;
      --focus: #1F2D3D;
      --radius: 4px;
      --shadow: 0 2px 0 rgba(38, 34, 32, 0.12);
      --font-display: 'Fraunces', serif;
      --font-body: 'Work Sans', sans-serif;
      --font-mono: 'IBM Plex Mono', monospace;
    }

    html[data-size="sm"] { font-size: 15px; }
    html[data-size="md"] { font-size: 17px; }
    html[data-size="lg"] { font-size: 20px; }
    html[data-size="xl"] { font-size: 24px; }

    html[data-contrast="high"] {
      --paper: #000000;
      --card: #0A0A0A;
      --ink: #FFFFFF;
      --ink-soft: #F4E24A;
      --indigo: #FFD400;
      --indigo-dark: #FFD400;
      --madder: #FF5A3C;
      --turmeric: #FFD400;
      --green: #6CFF9E;
      --thread: #FFFFFF;
      --thread-line: #FFFFFF;
      --focus: #FFD400;
      --shadow: none;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--font-body);
      transition: background .2s, color .2s;
    }

    h1, h2, h3, h4 {
      font-family: var(--font-display);
      margin: 0;
      letter-spacing: -0.01em;
    }

    p { margin: 0; }

    button, input, select, textarea {
      font-family: inherit;
      font-size: 1rem;
      color: inherit;
    }

    button { cursor: pointer; }
    a { color: var(--indigo); }

    :focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 2px;
    }

    html[data-hover="on"] button:hover,
    html[data-hover="on"] a:hover,
    html[data-hover="on"] .card:hover,
    html[data-hover="on"] .icon-btn:hover,
    html[data-hover="on"] select:hover,
    html[data-hover="on"] .toggle-row:hover {
      outline: 3px solid var(--turmeric);
      outline-offset: 2px;
      background: rgba(201, 150, 44, 0.15) !important;
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }

    .app {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .hidden { display: none !important; }

    /* ---------- Stamp mark (signature element) ---------- */
    .stamp { display: inline-block; }
    .stamp svg { display: block; }
    .stamp-press { animation: press 900ms ease; }

    @keyframes press {
      0% { transform: scale(1.6) rotate(-8deg); opacity: 0; }
      40% { transform: scale(0.94) rotate(2deg); opacity: 1; }
      60% { transform: scale(1.05) rotate(-1deg); }
      100% { transform: scale(1) rotate(0deg); }
    }

    /* ---------- Landing ---------- */
    .landing { flex: 1; display: flex; flex-direction: column; }

    .landing-top {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 1.4rem 1.6rem;
    }

    .brand { display: flex; align-items: center; gap: 0.6rem; }

    .brand-name {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 1.3rem;
    }

    .landing-main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.6rem 3rem;
    }

    .thesis-wrap { max-width: 640px; text-align: left; }

    .eyebrow {
      font-family: var(--font-mono);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      font-size: 0.75rem;
      color: var(--madder);
      margin-bottom: 0.9rem;
      display: block;
    }

    .thesis {
      font-size: clamp(1.8rem, 5vw, 2.8rem);
      line-height: 1.15;
      font-weight: 600;
    }

    .thesis em { font-style: italic; color: var(--indigo); }

    .thesis-sub {
      margin-top: 1.1rem;
      color: var(--ink-soft);
      font-size: 1.05rem;
      line-height: 1.5;
      max-width: 52ch;
    }

    .cta-row { margin-top: 2rem; display: flex; gap: 0.8rem; flex-wrap: wrap; }

    .btn {
      border: 2px solid var(--ink);
      border-radius: var(--radius);
      padding: 0.75rem 1.4rem;
      font-weight: 600;
      background: transparent;
      box-shadow: var(--shadow);
    }

    .btn-primary { background: var(--indigo); color: #fff; border-color: var(--indigo-dark); }
    html[data-contrast="high"] .btn-primary { color: #000; }
    .btn-primary:active { transform: translateY(1px); }
    .btn-ghost { background: transparent; }
    .btn-lg { padding: 0.95rem 1.8rem; font-size: 1.05rem; }
    .btn-sm { padding: 0.45rem 0.9rem; font-size: 0.85rem; }
    .btn-stamp { display: inline-flex; align-items: center; gap: 0.6rem; }

    /* ---------- Forms ---------- */
    .form-screen {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.2rem;
    }

    .form-card {
      width: 100%;
      max-width: 440px;
      background: var(--card);
      border: 2px solid var(--ink);
      border-radius: 6px;
      padding: 2rem;
      box-shadow: var(--shadow);
    }

    .form-card h2 { font-size: 1.6rem; margin-bottom: 0.3rem; }
    .form-card .form-sub { color: var(--ink-soft); font-size: 0.92rem; margin-bottom: 1.4rem; }
    .field { margin-bottom: 1.1rem; }

    .field label {
      display: block;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 0.35rem;
      color: var(--ink-soft);
    }

    .field input,
    .field select,
    .field textarea {
      width: 100%;
      padding: 0.65rem 0.7rem;
      border: 2px solid var(--thread-line);
      border-radius: var(--radius);
      background: var(--paper);
      color: var(--ink);
    }

    .field .hint { font-size: 0.78rem; color: var(--ink-soft); margin-top: 0.3rem; }
    .form-actions { margin-top: 1.4rem; display: flex; flex-direction: column; gap: 0.7rem; }
    .switch-line { text-align: center; font-size: 0.9rem; color: var(--ink-soft); }

    .form-error {
      background: rgba(168, 64, 47, 0.12);
      border: 1px solid var(--madder);
      color: var(--madder);
      padding: 0.6rem 0.8rem;
      border-radius: var(--radius);
      font-size: 0.88rem;
      margin-bottom: 1rem;
    }

    html[data-contrast="high"] .form-error { color: var(--ink); }

    /* ---------- App shell ---------- */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 1rem 1.6rem;
      border-bottom: 2px solid var(--ink);
      flex-wrap: wrap;
    }

    .top-nav { display: flex; gap: 0.4rem; flex-wrap: wrap; }

    .nav-link {
      border: 0;
      background: transparent;
      font-weight: 600;
      padding: 0.4rem 0.6rem;
      border-bottom: 3px solid transparent;
      color: var(--ink-soft);
    }

    .nav-link.active { color: var(--ink); border-bottom-color: var(--madder); }

    .top-right { display: flex; align-items: center; gap: 0.7rem; position: relative; }

    .icon-btn {
      width: 2.6rem;
      height: 2.6rem;
      border-radius: 50%;
      border: 2px solid var(--ink);
      background: var(--card);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon-btn svg { width: 1.3rem; height: 1.3rem; }

    .panel {
      position: absolute;
      top: 3.2rem;
      right: 0;
      width: 280px;
      background: var(--card);
      border: 2px solid var(--ink);
      border-radius: 6px;
      box-shadow: 0 6px 0 rgba(38, 34, 32, 0.14);
      padding: 1rem;
      z-index: 30;
    }

    .panel h3 {
      font-size: 0.78rem;
      font-family: var(--font-mono);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--ink-soft);
      margin-bottom: 0.7rem;
    }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.55rem 0.3rem;
      border-radius: var(--radius);
    }

    .toggle-row + .toggle-row { border-top: 1px solid var(--thread-line); }

    .switch {
      width: 2.6rem;
      height: 1.5rem;
      border-radius: 1rem;
      border: 2px solid var(--ink);
      background: var(--paper);
      position: relative;
      flex-shrink: 0;
    }

    .switch .dot {
      position: absolute;
      top: 1px;
      left: 1px;
      width: 1rem;
      height: 1rem;
      border-radius: 50%;
      background: var(--ink);
      transition: left .15s;
    }

    .switch.on { background: var(--indigo); }
    .switch.on .dot { left: calc(100% - 1.15rem); background: #fff; }
    html[data-contrast="high"] .switch.on .dot { background: #000; }

    .size-row { display: flex; gap: 0.4rem; margin-top: 0.4rem; }

    .size-btn {
      flex: 1;
      border: 2px solid var(--ink);
      background: var(--paper);
      border-radius: var(--radius);
      padding: 0.3rem 0;
      font-family: var(--font-mono);
      font-size: 0.8rem;
    }

    .size-btn.active { background: var(--indigo); color: #fff; }
    html[data-contrast="high"] .size-btn.active { color: #000; }

    .panel select {
      width: 100%;
      padding: 0.5rem;
      border: 2px solid var(--thread-line);
      border-radius: var(--radius);
      background: var(--paper);
      margin-top: 0.3rem;
    }

    .panel-section { margin-bottom: 1rem; }
    .panel-section:last-child { margin-bottom: 0; }

    main.body {
      flex: 1;
      padding: 2rem 1.6rem 3rem;
      max-width: 1040px;
      margin: 0 auto;
      width: 100%;
    }

    .greet { font-size: 1.7rem; margin-bottom: 0.2rem; }
    .greet-sub { color: var(--ink-soft); margin-bottom: 1.6rem; }
    .action-row { display: flex; gap: 0.8rem; flex-wrap: wrap; margin-bottom: 2rem; }

    .gallery-title {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-size: 1.1rem;
      font-family: var(--font-mono);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--ink-soft);
      margin-bottom: 1rem;
    }

    .gallery-title .rule { flex: 1; height: 1px; background: var(--thread-line); }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 1.1rem;
    }

    .card {
      background: var(--card);
      border: 2px solid var(--ink);
      border-radius: 6px;
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    .card img {
      width: 100%;
      height: 150px;
      object-fit: cover;
      display: block;
      border-bottom: 2px solid var(--ink);
    }

    .card-body { padding: 0.8rem; }

    .card-cat {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      text-transform: uppercase;
      color: var(--madder);
    }

    .card-desc {
      font-size: 0.88rem;
      margin-top: 0.25rem;
      color: var(--ink-soft);
      line-height: 1.4;
      white-space: pre-wrap;
    }

    .card-price { margin-top: 0.5rem; font-weight: 700; font-family: var(--font-mono); }

    .empty-state {
      border: 2px dashed var(--thread-line);
      border-radius: 6px;
      padding: 2.4rem 1.5rem;
      text-align: center;
      color: var(--ink-soft);
    }

    .empty-state .stamp { margin-bottom: 0.8rem; }

    /* ---------- Upload flow ---------- */
    .upload-screen { max-width: 560px; margin: 0 auto; }

    .dropzone {
      border: 2px dashed var(--thread-line);
      border-radius: 6px;
      padding: 2.2rem 1.2rem;
      text-align: center;
      cursor: pointer;
      background: var(--card);
    }

    .dropzone:hover { border-color: var(--indigo); }
    .preview-wrap { text-align: center; margin-bottom: 1.2rem; }

    .preview-wrap img {
      max-width: 100%;
      max-height: 260px;
      border: 2px solid var(--ink);
      border-radius: 6px;
    }

    .ai-status {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-family: var(--font-mono);
      font-size: 0.85rem;
      color: var(--indigo);
      margin: 0.9rem 0;
    }

    .ai-status.error { color: var(--madder); }

    .spinner {
      width: 1rem;
      height: 1rem;
      border: 2px solid var(--thread-line);
      border-top-color: var(--indigo);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    textarea {
      width: 100%;
      padding: 0.65rem 0.7rem;
      border: 2px solid var(--thread-line);
      border-radius: var(--radius);
      background: var(--paper);
      color: var(--ink);
      resize: vertical;
      min-height: 10rem;
    }

    /* ---------- Thank you ---------- */
    .thankyou {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }

    .thankyou h2 { font-size: 2rem; margin-top: 1.2rem; }
    .thankyou p { color: var(--ink-soft); margin-top: 0.5rem; max-width: 40ch; }

    .footer-note {
      text-align: center;
      color: var(--ink-soft);
      font-size: 0.8rem;
      padding: 1rem;
      font-family: var(--font-mono);
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
    }

    /* ---------- Voice dashboard ---------- */
    .voice-dashboard {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1.2rem;
      padding: 1.2rem;
      margin: 0 0 2rem;
      border-radius: 6px;
      background: var(--card);
      border: 2px solid var(--ink);
      box-shadow: var(--shadow);
      flex-wrap: wrap;
    }

    .voice-title { font-size: 1.15rem; font-weight: 700; font-family: var(--font-display); }
    .voice-subtitle { margin-top: 0.3rem; color: var(--ink-soft); font-size: 0.9rem; }

    .voice-heard {
      margin-top: 0.5rem;
      font-family: var(--font-mono);
      font-size: 0.8rem;
      color: var(--indigo);
    }

    .voice-button {
      width: 3.4rem;
      height: 3.4rem;
      border: 2px solid var(--indigo-dark);
      border-radius: 50%;
      font-size: 1.5rem;
      background: var(--indigo);
      color: #fff;
      flex-shrink: 0;
    }

    .voice-button.listening { animation: pulse 1.1s ease-in-out infinite; }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.12); }
    }

    .voice-help {
      margin-top: 0.8rem;
      font-size: 0.8rem;
      color: var(--ink-soft);
      width: 100%;
      line-height: 1.5;
    }

    /* ---------- Orders ---------- */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 0.8rem;
      margin-bottom: 1.6rem;
    }

    .stat-card {
      background: var(--card);
      border: 2px solid var(--ink);
      border-radius: 6px;
      padding: 0.9rem;
      box-shadow: var(--shadow);
    }

    .stat-val { font-size: 1.4rem; font-weight: 700; font-family: var(--font-mono); }
    .stat-label { font-size: 0.8rem; color: var(--ink-soft); margin-top: 0.15rem; }

    .filter-row { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1.2rem; }

    .filter-btn {
      border: 2px solid var(--ink);
      background: var(--paper);
      border-radius: var(--radius);
      padding: 0.4rem 0.9rem;
      font-weight: 600;
      font-size: 0.85rem;
    }

    .filter-btn.active { background: var(--indigo); color: #fff; border-color: var(--indigo-dark); }
    html[data-contrast="high"] .filter-btn.active { color: #000; }

    .order-row {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
      align-items: center;
      background: var(--card);
      border: 2px solid var(--ink);
      border-radius: 6px;
      padding: 0.9rem 1rem;
      margin-bottom: 0.8rem;
      box-shadow: var(--shadow);
    }

    .order-id { font-family: var(--font-mono); font-size: 0.75rem; color: var(--ink-soft); }
    .order-item { font-weight: 600; margin-top: 0.15rem; }
    .order-meta { font-size: 0.82rem; color: var(--ink-soft); margin-top: 0.15rem; }
    .order-right { text-align: right; }

    .pill {
      display: inline-block;
      font-family: var(--font-mono);
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      border: 2px solid var(--ink);
      border-radius: 1rem;
      padding: 0.15rem 0.6rem;
    }

    .pill-pending { background: rgba(201, 150, 44, 0.25); }
    .pill-ready { background: rgba(46, 64, 87, 0.18); }
    .pill-shipped { background: rgba(47, 107, 79, 0.2); }
    .order-amount { font-family: var(--font-mono); font-weight: 700; margin-top: 0.3rem; }

    /* ---------- Festival collection ---------- */
    .festival-screen { max-width: 900px; margin: 0 auto; }

    .festival-hero {
      background: var(--card);
      border: 2px solid var(--ink);
      border-radius: 6px;
      padding: 1.4rem;
      box-shadow: var(--shadow);
      margin-bottom: 1.2rem;
    }

    .festival-hero h2 { font-size: clamp(1.7rem, 4vw, 2.3rem); }
    .festival-sub { color: var(--ink-soft); margin-top: 0.45rem; line-height: 1.5; }

    .festival-section-title {
      font-family: var(--font-mono);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--ink-soft);
      font-size: 0.82rem;
      margin: 1.3rem 0 0.7rem;
    }

    .occasion-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(135px, 1fr));
      gap: 0.65rem;
    }

    .occasion-btn {
      border: 2px solid var(--ink);
      background: var(--paper);
      border-radius: var(--radius);
      padding: 0.7rem 0.55rem;
      font-weight: 600;
      box-shadow: var(--shadow);
    }

    .occasion-btn.active { background: var(--indigo); color: #fff; border-color: var(--indigo-dark); }
    html[data-contrast="high"] .occasion-btn.active { color: #000; }

    .budget-box {
      background: var(--card);
      border: 2px solid var(--ink);
      border-radius: 6px;
      padding: 1rem;
      margin-top: 1rem;
    }

    .budget-top { display: flex; justify-content: space-between; gap: 1rem; align-items: center; }
    .budget-value { font-family: var(--font-mono); font-weight: 700; font-size: 1.1rem; }
    .budget-slider { width: 100%; margin-top: 0.7rem; accent-color: var(--indigo); }
    .budget-help { color: var(--ink-soft); font-size: 0.82rem; margin-top: 0.35rem; }

    .festival-products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 1rem;
    }

    .festival-product {
      background: var(--card);
      border: 2px solid var(--ink);
      border-radius: 6px;
      padding: 1rem;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
    }

    .festival-product-icon {
      width: 58px;
      height: 58px;
      border: 2px solid var(--ink);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      margin-bottom: 0.7rem;
      background: var(--paper);
    }

    .festival-product h3 { font-size: 1.05rem; }
    .festival-product p { color: var(--ink-soft); font-size: 0.82rem; line-height: 1.4; margin-top: 0.3rem; flex: 1; }
    .festival-price { font-family: var(--font-mono); font-weight: 700; margin-top: 0.55rem; }

    .festival-add {
      width: 100%;
      margin-top: 0.7rem;
      padding: 0.55rem;
      border: 2px solid var(--ink);
      border-radius: var(--radius);
      background: transparent;
      font-weight: 600;
    }

    .festival-add:disabled { opacity: 0.45; cursor: not-allowed; }

    .collection-card {
      background: var(--card);
      border: 2px solid var(--ink);
      border-radius: 6px;
      padding: 1.2rem;
      margin-top: 1.4rem;
      box-shadow: var(--shadow);
    }

    .collection-heading {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      align-items: flex-start;
      flex-wrap: wrap;
    }

    .collection-heading h2 { font-size: 1.35rem; }
    .collection-count { font-family: var(--font-mono); color: var(--ink-soft); font-size: 0.82rem; }
    .collection-items { margin-top: 1rem; }

    .collection-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.8rem;
      padding: 0.7rem 0;

    function getFestivalCatalog(occasion) {
      if (occasion === "Other") {
        const seen = new Set();
        const combined = [];
        Object.entries(FESTIVAL_CATALOG).forEach(([key, items]) => {
          if (key === "Other") return;
          items.forEach(item => {
            if (!seen.has(item[0])) { seen.add(item[0]); combined.push(item); }
          });
        });
        return combined.map(catalogItemToObject);
      }
      return (FESTIVAL_CATALOG[occasion] || []).map(catalogItemToObject);
    }

    /* ============================= Storage helpers ============================= */
    async function storeGet(key) {
      try {
        if (window.storage && typeof window.storage.get === 'function') {
          const r = await window.storage.get(key, false);
          return r ? JSON.parse(r.value) : null;
        }
        const raw = localStorage.getItem(key);
        return raw ? JSON.parse(raw) : null;
      } catch (e) {
        try {
          const raw = localStorage.getItem(key);
          return raw ? JSON.parse(raw) : null;
        } catch (fallbackError) {
          console.error('storage get failed', fallbackError);
          return null;
        }
      }
    }

    async function storeSet(key, value) {
      try {
        if (window.storage && typeof window.storage.set === 'function') {
          await window.storage.set(key, JSON.stringify(value), false);
          return;
        }
        localStorage.setItem(key, JSON.stringify(value));
      } catch (e) {
        try {
          localStorage.setItem(key, JSON.stringify(value));
        } catch (fallbackError) {
          console.error('storage set failed', fallbackError);
        }
      }

    /* ============================= Speech (text to speech) ============================= */
    const SPEECH_LANGS = { en: 'en-IN', hi: 'hi-IN', kn: 'kn-IN', ta: 'ta-IN', te: 'te-IN', ml: 'ml-IN' };

    function speak(text, force) {
      if (!text) return;
      if (!state.tts && !force) return;
      if (!('speechSynthesis' in window) || !window.SpeechSynthesisUtterance) {
        if (force) showToast(t('ttsUnsupported'));
        return;
      }
      const message = String(text).trim();
      if (!message) return;

      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(message);
      const language = SPEECH_LANGS[state.lang] || 'en-IN';
      utterance.lang = language;
      utterance.rate = 0.95;
      utterance.pitch = 1;
      utterance.volume = 1;

      const voices = window.speechSynthesis.getVoices() || [];
      const exact = voices.find(v => v.lang && v.lang.toLowerCase() === language.toLowerCase());
      const regional = voices.find(v => v.lang && v.lang.toLowerCase().startsWith(language.slice(0, 2)));
      if (exact) utterance.voice = exact;
      else if (regional) utterance.voice = regional;

      utterance.onerror = ev => console.error('Text to speech error:', ev.error || ev);
      window.speechSynthesis.speak(utterance);
    }

    function registerTtsClicks() {
      if (!state.tts) return;
      const selectors = ['h1', 'h2', 'h3', 'h4', 'p', 'li', 'label', '.eyebrow', '.brand-name',
        '.card-desc', '.card-cat', '.order-item', '.footer-note', '.voice-title', '.voice-subtitle',
        '.caption-text', '.wa-preview', '.pp-headline', '.poster-title', '.pi-title', '.mp-name'];

      document.querySelectorAll(selectors.join(',')).forEach(el => {
        if (el.dataset.ttsBound === '1') return;
        if (el.closest('button, a, input, select, textarea')) return;
        const text = (el.innerText || el.textContent || '').trim();
        if (!text) return;

        el.dataset.ttsBound = '1';
        el.style.cursor = 'pointer';
        el.title = 'Tap to hear this read aloud';
        el.setAttribute('tabindex', '0');
        el.setAttribute('role', 'button');
        el.setAttribute('aria-label', 'Read aloud: ' + text);

        el.addEventListener('click', ev => { ev.stopPropagation(); speak(text); });
        el.addEventListener('keydown', ev => {
          if (ev.key === 'Enter' || ev.key === ' ') {
            ev.preventDefault(); ev.stopPropagation(); speak(text);
          }
        });
      });

      if ('speechSynthesis' in window) {
        window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
      }
    }

    function startVoiceCommand() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) { showToast(t('micUnsupported')); return; }

      if (state.voiceListening && voiceRecognition) {
        voiceRecognition.stop();
        return;
      }

      voiceRecognition = new SpeechRecognition();
      voiceRecognition.continuous = false;
      voiceRecognition.interimResults = false;
      voiceRecognition.lang = SPEECH_LANGS[state.lang] || 'en-IN';

      voiceRecognition.onstart = () => { state.voiceListening = true; state.voiceHeard = t('listening'); render(); };
      voiceRecognition.onend = () => { state.voiceListening = false; render(); };
      voiceRecognition.onerror = ev => {
        state.voiceListening = false;
        console.error('Voice recognition error:', ev.error);
        state.voiceHeard = '';
        render();
        showToast(t('micError'));
      };
      voiceRecognition.onresult = ev => {
        const text = ev.results[0][0].transcript;
        state.voiceHeard = t('heard') + text;
        handleVoiceCommand(text);
      };

      try { voiceRecognition.start(); } catch (e) { console.error(e); }
    }

    function matchVoiceCommand(spoken) {
      const said = spoken.toLowerCase().trim();
      const packs = [VOICE_COMMANDS[state.lang], VOICE_COMMANDS.en];
      for (const pack of packs) {
        if (!pack) continue;
        for (const command of Object.keys(pack)) {
          for (const phrase of pack[command]) {
            if (said.includes(phrase.toLowerCase())) return command;
          }
        }
      }
      return null;
    }

    function handleVoiceCommand(spoken) {
      const command = matchVoiceCommand(spoken);
      const pendingCount = state.orders.filter(o => o.status === 'pending').length;
      const readyCount = state.orders.filter(o => o.status === 'ready').length;
      const earnings = state.orders.reduce((sum, o) => sum + o.amount, 0);

      if (command === 'orders') {
        state.view = 'orders'; state.orderFilter = 'all'; render();

    /* ============================= Upload + AI description ============================= */
    const AI_ENDPOINT = 'http://localhost:8000/api/analyze-product';

    function fileToDataUrl(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    function localDescription() {
      return 'A handcrafted piece made by an artisan, finished by hand and made in small numbers. '
        + 'Add the material, size and the technique you used, so buyers know what makes it yours.';
    }

    async function processProductUpload(event) {
      const file = event && event.target ? event.target.files[0] : event;
      if (!file) return;

      let dataUrl;
      try {
        dataUrl = await fileToDataUrl(file);
      } catch (e) {
        showToast('That photo could not be opened. Try another one.');
        return;
      }

      state.aiStatus = 'loading';
      state.pending = { dataUrl, category: '', description: '' };
      render();

      const formData = new FormData();
      formData.append('file', file);

      try {
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 8000);
        const response = await fetch(AI_ENDPOINT, { method: 'POST', body: formData, signal: controller.signal });
        clearTimeout(timeout);
        if (!response.ok) throw new Error('Analysis request failed');

        const data = await response.json();
        const materials = (data.materials || []).join(', ');
        const colors = (data.color_palette || []).join(', ');
        let description = data.amazon_description || data.description || localDescription();
        if (materials) description += '\n\nMaterials: ' + materials;
        if (colors) description += '\nColours: ' + colors;

        state.aiStatus = 'done';
        state.pending = {
          dataUrl,
          category: data.category || data.product_title || 'Handicraft',
          description
        };
        render();
      } catch (error) {
        console.warn('AI description unavailable, using a local starting text:', error);
        state.aiStatus = 'error';
        state.pending = { dataUrl, category: 'Handicraft', description: localDescription() };
        render();
      }
    }

    async function handleSaveProduct(e) {
      e.preventDefault();
      if (!state.pending) return false;
      const category = document.getElementById('up-cat').value.trim();
      const description = document.getElementById('up-desc').value.trim();
      const price = document.getElementById('up-price').value;
      const product = { id: Date.now(), dataUrl: state.pending.dataUrl, category, description, price };
      const products = [product, ...state.products];
      if (state.user) await storeSet('products:' + state.user.email, products);
      setState({ products, pending: null, aiStatus: 'idle', view: 'thankyou' });
      return false;
    }

    const FESTIVAL_OCCASIONS = ["Diwali", "Wedding", "Birthday", "Housewarming", "Baby Shower",

    function setFestivalOccasion(occasion) {
      state.festivalOccasion = occasion;
      state.festivalCollection = [];

    function setFestivalBudget(value) {
      state.festivalBudget = Number(value);
      const el = document.getElementById('budget-value');
      if (el) el.textContent = money(state.festivalBudget);
      clearTimeout(setFestivalBudget._timer);
      setFestivalBudget._timer = setTimeout(render, 220);
    }

    function festivalTotal() {
      return state.festivalCollection.reduce((sum, item) => sum + item.price * item.qty, 0);
    }

    function festivalCount() {
      return state.festivalCollection.reduce((sum, item) => sum + item.qty, 0);
    }

    function addFestivalProduct(id) {
      const product = findFestivalProduct(id);
      if (!product) return;
      if (festivalTotal() + product.price > state.festivalBudget) { showToast(ft('overAdd')); return; }

      const existing = state.festivalCollection.find(p => p.id === id);
      if (existing) existing.qty += 1;
      else state.festivalCollection.push({ id: product.id, price: product.price, qty: 1 });
      render();
    }

    function changeFestivalQty(id, change) {
      const item = state.festivalCollection.find(p => p.id === id);
      if (!item) return;
      if (change > 0 && festivalTotal() + item.price > state.festivalBudget) { showToast(ft('overQty')); return; }
      item.qty += change;
      if (item.qty <= 0) state.festivalCollection = state.festivalCollection.filter(p => p.id !== id);
      render();
    }

    function removeFestivalProduct(id) {
      state.festivalCollection = state.festivalCollection.filter(p => p.id !== id);
      render();
    }

    function customizeFestivalCollection() {
      if (state.festivalCollection.length === 0) { showToast(ft('noProduct')); return; }
      showToast(ft('ready'));
    }

    function buyFestivalCollection() {
      if (state.festivalCollection.length === 0) { showToast(ft('noProduct')); return; }
      const total = festivalTotal();
      if (total > state.festivalBudget) { showToast(ft('budgetOver')); return; }
      showToast(`${festivalOccasionLabel(state.festivalOccasion)} ${ft('created')}${total.toLocaleString('en-IN')}`);
      state.festivalCollection = [];
      render();
    }

    function viewFestival() {
      const products = getFestivalProducts(state.festivalOccasion);
      const total = festivalTotal();
      const count = festivalCount();
      const remaining = state.festivalBudget - total;

      return `

      <div class="festival-products">

            <div class="festival-product">
              <div class="festival-product-icon">${p.icon}</div>
              <h3>${p.name}</h3>
              <p>${p.desc}</p>

            return `
            <div class="collection-item">
              <div class="collection-item-info">

                <div class="collection-item-price">${money(item.price)} ${ft('each')}</div>

    /* ============================= Apprenticeship marketplace ============================= */
    function setApprenticeTab(tab) { setState({ apprenticeTab: tab }); }

    function setApprenticeFilter(key, value) {
      state.apprenticeFilters[key] = value;
      render();
    }

    function filteredListings() {
      const f = state.apprenticeFilters;
      return state.listings.filter(l => {
        if (f.craft !== 'All crafts' && l.craft !== f.craft) return false;
        if (f.location && !l.location.toLowerCase().includes(f.location.toLowerCase())) return false;
        if (f.duration !== 'Any duration' && l.duration !== f.duration) return false;
        if (f.stipend === 'Paid only' && !l.stipend) return false;
        if (f.stipend === 'Learning opportunity' && l.stipend) return false;
        return true;
      });
    }

    function openModal(kind) {
      state.modal = kind;
      state.listingStep = 1;
      if (kind === 'listing') state.listingDraft = { craft: 'Pottery', skills: [], duration: '3 months', mode: "At artisan's workshop", stipend: '', location: '' };
      if (kind === 'learner') state.learnerDraft = { name: '', craft: '', intro: '' };
      render();
    }

    function closeModal() { state.modal = null; render(); }

    function setListingStep(step) {
      if (step === 4) return;
      state.listingStep = step;
      render();
    }

    function updateListingDraft(key, value) { state.listingDraft[key] = value; }

    function toggleListingSkill(skill, el) {
      const skills = state.listingDraft.skills;
      const index = skills.indexOf(skill);
      if (index >= 0) skills.splice(index, 1); else skills.push(skill);
      if (el) el.classList.toggle('selected');
    }

    function publishListing(e) {
      e.preventDefault();
      const location = document.getElementById('listing-location').value.trim();
      const stipend = Number(document.getElementById('listing-stipend').value || 0);
      const duration = document.getElementById('listing-duration').value;
      const mode = document.getElementById('listing-mode').value;
      if (!location) { showToast('Add the village or town where you teach.'); return false; }

      const draft = state.listingDraft;
      const listing = {
        id: 'listing-' + Date.now(),
        artisan: state.user ? state.user.name : 'You',
        avatar: '🧑‍🎨', verified: false,
        title: 'Artisan', location,
        craft: draft.craft, craftIcon: '🧵',
        duration, stipend, seats: 2, mode,
        lineage: ['Your teacher', state.user ? state.user.name : 'You', 'Your apprentice'],
        quote: 'Learn it by doing it, beside me.',
        skills: draft.skills.length ? draft.skills.slice() : ['Basic techniques']
      };
      state.listings = [listing, ...state.listings];
      state.modal = null;
      state.apprenticeTab = 'browse';
      render();
      showToast('Apprenticeship published.');
      return false;
    }

    function createLearnerProfile(e) {
      e.preventDefault();
      const name = document.getElementById('learner-name').value.trim();
      const craft = document.getElementById('learner-craft').value.trim();
      const intro = document.getElementById('learner-intro').value.trim();
      if (!name || !craft) { showToast('Add your name and the craft you want to learn.'); return false; }

      state.learners = [{
        id: 'learner-' + Date.now(), name, avatar: '🌱', age: '—',
        location: 'India', intro: intro || 'I would like to learn this craft from a master artisan.',
        interests: [craft], level: 'Beginner'
      }, ...state.learners];
      state.modal = null;
      state.apprenticeTab = 'learners';
      render();
      showToast('Learner profile created.');
      return false;
    }

    function contactListing(id) {
      const listing = state.listings.find(l => l.id === id);
      if (listing) showToast('We shared your interest with ' + listing.artisan + '.');
    }

    function contactLearner(id) {
      const learner = state.learners.find(l => l.id === id);
      if (learner) showToast('We shared your message with ' + learner.name + '.');
    }

    function viewApprenticeship() {
      const listings = filteredListings();
      const teaching = state.listings.filter(l => state.user && l.artisan === state.user.name).length;
      return `
  ${topbar()}
  <main class="body">
    <h2 class="greet">🧑‍🎨 ${t('apprenticeship')}</h2>
    <p class="greet-sub">Teach your craft, or learn it from someone who has done it for years.</p>

    <div class="action-row">
      <button class="btn btn-primary" onclick="openModal('listing')">+ Find an apprentice</button>
      <button class="btn btn-ghost" onclick="openModal('learner')">🌱 I want to learn</button>
      <button class="btn btn-ghost btn-stamp" onclick="go('home')">${iconHome()} ${t('home')}</button>
    </div>

    <div class="stats-grid">
      <div class="stat-card"><div class="stat-val">${state.listings.length}</div><div class="stat-label">Open apprenticeships</div></div>
      <div class="stat-card"><div class="stat-val">${state.learners.length}</div><div class="stat-label">Learners looking</div></div>
      <div class="stat-card"><div class="stat-val">${teaching}</div><div class="stat-label">Listings you posted</div></div>
      <div class="stat-card"><div class="stat-val">48 hrs</div><div class="stat-label">Knowledge shared</div></div>
    </div>

    <div class="filter-row">
      <button class="filter-btn ${state.apprenticeTab === 'browse' ? 'active' : ''}" onclick="setApprenticeTab('browse')">Browse opportunities</button>
      <button class="filter-btn ${state.apprenticeTab === 'learners' ? 'active' : ''}" onclick="setApprenticeTab('learners')">Learner profiles</button>
    </div>

    ${state.apprenticeTab === 'browse' ? `
      <div class="marketplace-layout">
        <aside class="filter-card">
          <h3>Filter listings</h3>
          <div class="filter-group">
            <label for="f-craft">Craft</label>
            <select id="f-craft" onchange="setApprenticeFilter('craft', this.value)">
              ${['All crafts'].concat(CRAFT_OPTIONS).map(c => `<option ${state.apprenticeFilters.craft === c ? 'selected' : ''}>${c}</option>`).join('')}
            </select>
          </div>
          <div class="filter-group">
            <label for="f-location">Location</label>
            <input id="f-location" type="text" placeholder="e.g. Karnataka" value="${escapeHtml(state.apprenticeFilters.location)}"
                   oninput="setApprenticeFilter('location', this.value)">
          </div>
          <div class="filter-group">
            <label for="f-duration">Duration</label>
            <select id="f-duration" onchange="setApprenticeFilter('duration', this.value)">
              ${['Any duration', '1 month', '3 months', '6 months'].map(d => `<option ${state.apprenticeFilters.duration === d ? 'selected' : ''}>${d}</option>`).join('')}
            </select>
          </div>
          <div class="filter-group">
            <label for="f-stipend">Stipend</label>
            <select id="f-stipend" onchange="setApprenticeFilter('stipend', this.value)">
              ${['All', 'Paid only', 'Learning opportunity'].map(s => `<option ${state.apprenticeFilters.stipend === s ? 'selected' : ''}>${s}</option>`).join('')}
            </select>
          </div>
        </aside>

        <div class="listings-grid">
          ${listings.length === 0 ? `<div class="empty-state"><p>No apprenticeships match these filters. Widen the search or clear the location.</p></div>`
            : listings.map(l => `
            <article class="listing-card">
              <div class="artisan-header">
                <div class="avatar">${l.avatar}</div>
                <div>
                  <h4>${escapeHtml(l.artisan)}${l.verified ? `<span class="badge">Verified</span>` : ''}</h4>
                  <div class="artisan-meta">${escapeHtml(l.title)} · ${escapeHtml(l.location)}</div>
                </div>
              </div>
              <h3 class="craft-name">${l.craftIcon} ${escapeHtml(l.craft)}</h3>
              <p class="listing-meta">⏳ ${escapeHtml(l.duration)} · ${l.stipend ? '💰 ' + money(l.stipend) + '/month' : '🎓 Learning opportunity'} · 👥 ${l.seats} seats</p>
              <div class="lineage-box">
                <div class="lineage-label">Craft knowledge journey</div>
                <p class="lineage-quote">“${escapeHtml(l.quote)}”</p>
                <div class="lineage-tree">${l.lineage.map(escapeHtml).join(' → ')}</div>
              </div>

              </div>
              <p class="listing-meta" style="margin-bottom:0.8rem">📍 ${escapeHtml(l.mode)}</p>
              <button class="btn btn-primary" style="width:100%" onclick="contactListing('${l.id}')">Ask about this apprenticeship</button>
            </article>
          `).join('')}
        </div>
      </div>
    ` : `
      <div class="listings-grid">
        ${state.learners.map(l => `
          <article class="listing-card">
            <div class="artisan-header">
              <div class="avatar">${l.avatar}</div>
              <div>
                <h4>${escapeHtml(l.name)}</h4>
                <div class="artisan-meta">Age ${escapeHtml(l.age)} · ${escapeHtml(l.location)}</div>
              </div>
            </div>
            <p class="listing-meta" style="font-style:italic;margin-bottom:0.7rem">“${escapeHtml(l.intro)}”</p>
            <div class="learn-label">Wants to learn</div>
            <div class="chip-container">${l.interests.map(i => `<span class="chip">${escapeHtml(i)}</span>`).join('')}</div>
            <p class="listing-meta" style="margin-bottom:0.8rem">Skill level: ${escapeHtml(l.level)}</p>
            <button class="btn btn-primary" style="width:100%" onclick="contactLearner('${l.id}')">Contact learner</button>
          </article>
        `).join('')}
      </div>
    `}
  </main>`;

    /* ============================= Modals ============================= */
    function renderModal() {
      if (!state.modal) return '';
      if (state.modal === 'listing') return renderListingModal();
      return renderLearnerModal();
    }

    function renderListingModal() {
      const step = state.listingStep;
      const draft = state.listingDraft;
      return `<div class="modal" role="dialog" aria-modal="true" aria-label="Create apprenticeship">
    <div class="modal-body">
      <h3>Create an apprenticeship</h3>
      <p class="modal-sub">Three short steps. You can edit the listing later.</p>
      <div class="step-dots">
        ${[1, 2, 3].map(s => `<span class="step-dot ${step >= s ? 'active' : ''}"></span>`).join('')}
      </div>

      ${step === 1 ? `
        <h4>1. What do you teach?</h4>
        <div class="field" style="margin-top:0.8rem">
          <label for="listing-craft">Craft</label>
          <select id="listing-craft" onchange="updateListingDraft('craft', this.value)">
            ${CRAFT_OPTIONS.map(c => `<option ${draft.craft === c ? 'selected' : ''}>${c}</option>`).join('')}
          </select>
        </div>
        <div class="modal-actions">
          <button class="btn btn-ghost" onclick="closeModal()">${t('cancel')}</button>
          <button class="btn btn-primary" onclick="setListingStep(2)">Next</button>
        </div>
      ` : ''}

      ${step === 2 ? `
        <h4>2. What will the apprentice learn?</h4>
        <p class="modal-sub" style="margin-top:0.3rem">Tap everything that applies.</p>
        <div class="chip-container">
          ${LEARN_SKILLS.map(s => `<span class="chip selectable ${draft.skills.includes(s) ? 'selected' : ''}"
            onclick="toggleListingSkill('${s}', this)">${s}</span>`).join('')}
        </div>
        <div class="modal-actions">
          <button class="btn btn-ghost" onclick="setListingStep(1)">Back</button>
          <button class="btn btn-primary" onclick="setListingStep(3)">Next</button>
        </div>
      ` : ''}

      ${step === 3 ? `
        <h4>3. Time, place and stipend</h4>
        <form onsubmit="return publishListing(event)" style="margin-top:0.8rem">
          <div class="field">
            <label for="listing-duration">Duration</label>
            <select id="listing-duration">
              ${['1 month', '3 months', '6 months'].map(d => `<option ${draft.duration === d ? 'selected' : ''}>${d}</option>`).join('')}
            </select>
          </div>
          <div class="field">
            <label for="listing-mode">Where the learning happens</label>
            <select id="listing-mode">
              ${["At artisan's workshop", 'Community workshop', 'Online guidance', 'Hybrid'].map(m => `<option ${draft.mode === m ? 'selected' : ''}>${m}</option>`).join('')}
            </select>
          </div>
          <div class="field">
            <label for="listing-stipend">Monthly stipend (₹)</label>
            <input id="listing-stipend" type="number" min="0" placeholder="Leave empty if this is unpaid learning">

          <div class="field">
            <label for="listing-location">Village or town, district, state</label>
            <input id="listing-location" type="text" placeholder="e.g. Channapatna, Karnataka" required>
          </div>
          <div class="modal-actions">
            <button type="button" class="btn btn-ghost" onclick="setListingStep(2)">Back</button>
            <button type="submit" class="btn btn-primary">Publish listing</button>
          </div>
        </form>
      ` : ''}
    </div>
  </div>`;
    }

          <button type="submit" class="btn btn-primary">Create profile</button>
        </div>
      </form>
    </div>
  </div>`;

    function emojiForCategory(cat) {
      cat = (cat || '').toLowerCase();
      if (cat.includes('diya') || cat.includes('brass')) return '🪔';
      if (cat.includes('toy')) return '🧸';
      if (cat.includes('saree') || cat.includes('silk')) return '🥻';
      if (cat.includes('pottery') || cat.includes('vase')) return '🏺';
      if (cat.includes('basket') || cat.includes('bamboo')) return '🧺';
      return '🎁';

    function mktName(group, key, lang) {

    function generateMarketing(product, opts) {
      const lang = opts.language || 'en';
      const ph = MKT_PH[lang] || MKT_PH.en;
      const styleName = mktName('styles', opts.style, lang);
      const audienceName = mktName('audiences', opts.audience, lang);
      const festivalName = opts.festival ? mktName('festivals', opts.festival, lang) : '';
      const productName = product.category;
      const artisan = product.artisan || (state.user ? state.user.name : 'Artisan');
      const location = product.location || '';
      const variant = opts.variant || 0;
      const note = opts.note ? (' ' + opts.note) : '';

      let headline;
      if (variant % 2 === 1) {
        headline = opts.festival
          ? `${productName} — ${festivalName} ${ph.special}, ${ph.handcraftedWith}`
          : `${productName} — ${ph.everyPieceStory}`;
      } else if (opts.festival) {
        headline = `${festivalName} ${ph.special}: ${productName}, ${ph.handcraftedWith}`;
      } else {
        headline = `${styleName} · ${productName} ${ph.by} ${artisan}`;
      }

      const byline = location ? `${ph.madeByArtisan} ${location},` : ph.madeByArtisan;
      const audienceLine = audienceName ? `${ph.perfectFor} ${audienceName}.` : '';

      const captions = {
        story: `${headline}\n\n${ph.everyPieceStory} ${byline} ${artisan}. ${audienceLine}${note}\n\n${ph.priceLabel}: ₹${product.price}\n${ph.shopNow} 🧵`,
        short: `${headline} ✨ ₹${product.price} — ${ph.shopNow}`,
        sales: `${ph.limitedStock}! ${productName} — ₹${product.price}. ${audienceLine} ${ph.shopNow} 🛍️`
      };

      const whatsapp = `${emojiForCategory(product.category)} *${productName}*\n\n${byline} ${artisan}${location ? (', ' + location) : ''}.${note}\n\n${ph.priceLabel}: ₹${product.price}\n✨ ${(MKT_UI[lang] || MKT_UI.en).handmade}\n\n${ph.shopNow}:\n[karigari.app/product/${product.id}]`;

      return {
        headline,
        captions,
        whatsapp,
        poster: {
          tagline: opts.festival ? `${festivalName} ${ph.special}` : styleName,
          badge: (MKT_UI[lang] || MKT_UI.en).handmade,
          cta: ph.shopNow
        }
      };
    }

      const clicks = Math.round(views * 0.07);
      const entry = {
        id: Date.now(), productId: mk.product.id, productName: mk.product.category,
        dataUrl: mk.product.dataUrl, date: new Date().toLocaleDateString(),
        types: mk.formats.slice(), style: mk.style, festival: mk.festival, shares: 0,
        views, clicks, engagement: Math.round(views * 0.045), orders: Math.round(clicks * 0.15)
      };
      const promotions = [entry, ...state.promotions];
      state.promotions = promotions;
      if (state.user) await storeSet('promotions:' + state.user.email, promotions);
    }

    function generateContent() {
      const mk = state.marketing;
      keepMktNote();
      if (mk.formats.length === 0) { showToast(mt('pickFormat')); return; }
      const generated = generateMarketing(mk.product, {
        style: mk.style, audience: mk.audience, festival: mk.festival,
        language: mk.language, variant: mk.variant, note: state.marketing.note
      });
      const next = Object.assign({}, mk, { generated, activeCaption: 'story', note: state.marketing.note });
      recordPromotion(next).then(() => setState({ marketing: next }));
    }

    function regenerateContent() {
      const mk = state.marketing;
      const variant = mk.variant + 1;
      const generated = generateMarketing(mk.product, {
        style: mk.style, audience: mk.audience, festival: mk.festival,
        language: mk.language, variant, note: mk.note
      });
      patchMarketing({ variant, generated });
    }

    function copyActiveCaption() {
      const mk = state.marketing;
      copyText(mk.generated.captions[mk.activeCaption || 'story']);
    }
    function copyWhatsappMsg() { copyText(state.marketing.generated.whatsapp); }
    function shareWhatsappMsg() { shareOnWhatsapp(state.marketing.generated.whatsapp); }

    function copyText(text) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => showToast(mt('copied'))).catch(() => fallbackCopy(text));
      } else {
        fallbackCopy(text);
      }
    }

    function fallbackCopy(text) {
      try {
        const ta = document.createElement('textarea');
        ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        showToast(mt('copied'));
      } catch (e) { console.error(e); }
    }

    function shareOnWhatsapp(text) {
      window.open('https://wa.me/?text=' + encodeURIComponent(text), '_blank');
      bumpShare();
    }

    function sharePosterNow() {
      if (navigator.share) {
        navigator.share({ title: 'Karigari', text: state.marketing.generated.poster.tagline }).catch(() => {});
      } else {
        showToast(mt('noShare'));
      }
      bumpShare();
    }

    function bumpShare() {
      if (!state.promotions.length) return;
      const latest = Object.assign({}, state.promotions[0], { shares: (state.promotions[0].shares || 0) + 1 });
      const promotions = [latest, ...state.promotions.slice(1)];
      state.promotions = promotions;
      if (state.user) storeSet('promotions:' + state.user.email, promotions);
    }

    function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
      const words = (text || '').split(' ');
      let line = ''; let yy = y;
      for (let n = 0; n < words.length; n++) {
        const test = line + words[n] + ' ';
        if (ctx.measureText(test).width > maxWidth && n > 0) {
          ctx.fillText(line, x, yy); line = words[n] + ' '; yy += lineHeight;
        } else {
          line = test;
        }
      }
      ctx.fillText(line, x, yy);
    }

    function downloadPoster() {
      const mk = state.marketing;
      const g = mk.generated;
      const product = mk.product;
      const styleColors = { traditional: '#A8402F', modern: '#2E4057', premium: '#262220', festival: '#C9962C', story: '#5B7C6B' };
      const canvas = document.createElement('canvas');
      canvas.width = 800; canvas.height = 1000;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = styleColors[mk.style] || '#A8402F';
      ctx.fillRect(0, 0, 800, 1000);

      const finishDraw = () => {
        ctx.fillStyle = 'rgba(0,0,0,0.35)';
        ctx.fillRect(0, 600, 800, 400);
        ctx.fillStyle = '#F4EFE2';
        ctx.font = '600 26px sans-serif';
        ctx.fillText((g.poster.tagline || '').toUpperCase(), 50, 660);
        ctx.font = '700 48px serif';
        wrapText(ctx, product.category, 50, 720, 700, 54);
        ctx.font = '600 32px sans-serif';
        ctx.fillText('₹' + product.price, 50, 860);
        ctx.font = '400 22px sans-serif';
        ctx.fillText((product.artisan || (state.user ? state.user.name : '')) + (product.location ? (' · ' + product.location) : ''), 50, 900);
        ctx.font = '700 24px sans-serif';
        ctx.fillText('Karigari · ' + g.poster.badge, 50, 950);
        const a = document.createElement('a');
        a.href = canvas.toDataURL('image/png');
        a.download = (product.category || 'poster').replace(/\s+/g, '_') + '_poster.png';
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
      };

      const img = new Image();
      img.onload = () => {
        const scale = Math.max(800 / img.width, 1000 / img.height);
        const w = img.width * scale, h = img.height * scale;
        ctx.globalAlpha = 0.85;
        ctx.drawImage(img, (800 - w) / 2, (1000 - h) / 2, w, h);
        ctx.globalAlpha = 1;
        finishDraw();
      };
      img.onerror = finishDraw;
      img.src = product.dataUrl;
    }

    let mktRecognition = null;

    function toggleVoiceInput() {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) { showToast(mt('noVoice')); return; }
      const mk = state.marketing;
      if (mk.listening) {
        if (mktRecognition) mktRecognition.stop();
        patchMarketing({ listening: false });
        return;
      }
      keepMktNote();
      mktRecognition = new SR();
      mktRecognition.lang = SPEECH_LANGS[mk.language] || 'en-IN';
      mktRecognition.onresult = e => {
        const text = e.results[0][0].transcript;
        const note = (state.marketing.note ? state.marketing.note + ' ' : '') + text;
        patchMarketing({ note, listening: false });
      };
      mktRecognition.onend = () => { if (state.marketing.listening) patchMarketing({ listening: false }); };
      mktRecognition.onerror = () => { patchMarketing({ listening: false }); showToast(t('micError')); };
      try { mktRecognition.start(); } catch (e) { console.error(e); }
      patchMarketing({ listening: true });
    }

    function promoteAgain(promoId) {
      const entry = state.promotions.find(p => p.id === promoId);
      if (!entry) return;
      const product = state.products.find(p => String(p.id) === String(entry.productId))
        || { id: entry.productId, category: entry.productName, dataUrl: entry.dataUrl, price: '' };
      const mk = defaultMarketing(product);
      mk.formats = entry.types.length ? entry.types.slice() : mk.formats;
      mk.style = entry.style || mk.style;
      mk.festival = entry.festival || null;
      setState({ marketing: mk, view: 'home' });
    }

    /* ============================= One-tap marketing: views ============================= */
    function renderMarketingResults(mk) {
      const g = mk.generated;
      const product = mk.product;
      const activeCap = mk.activeCaption || 'story';
      const imgStyle = photoFilterCss();
      const artisanLine = escapeHtml((product.artisan || (state.user ? state.user.name : '')) + (product.location ? (' · ' + product.location) : ''));
      let html = `<div class="mkt-results">`;

      if (mk.formats.includes('social')) {
        html += `<div class="mkt-result-card">
      <h3>📱 ${mt('social')}</h3>
      <div class="post-preview ${mk.photo.square ? 'square' : ''}">
        <img src="${product.dataUrl}" alt="${escapeHtml(product.category)}" style="${imgStyle}">
        <div class="pp-body">
          <div class="pp-headline">${escapeHtml(g.headline)}</div>
          <div class="pp-meta">₹${escapeHtml(product.price)} · ${artisanLine}</div>
          <span class="pp-badge">${mt('handmade')}</span>
          <div><span class="pp-cta">${mt('shopNow')}</span></div>
        </div>
      </div>
      <div class="caption-tabs">
        <button class="caption-tab ${activeCap === 'story' ? 'active' : ''}" onclick="setActiveCaption('story')">${mt('story')}</button>
        <button class="caption-tab ${activeCap === 'short' ? 'active' : ''}" onclick="setActiveCaption('short')">${mt('short')}</button>
        <button class="caption-tab ${activeCap === 'sales' ? 'active' : ''}" onclick="setActiveCaption('sales')">${mt('sales')}</button>
      </div>
      <div class="caption-text">${escapeHtml(g.captions[activeCap])}</div>
      <div class="btn-row">
        <button class="btn btn-ghost btn-sm" onclick="copyActiveCaption()">${mt('copyCaption')}</button>
      </div>
    </div>`;
      }

      if (mk.formats.includes('whatsapp')) {
        html += `<div class="mkt-result-card">
      <h3>💬 ${mt('whatsapp')}</h3>
      <div class="wa-preview">${escapeHtml(g.whatsapp)}</div>
      <div class="btn-row">
        <button class="btn btn-ghost btn-sm" onclick="copyWhatsappMsg()">${mt('copyMessage')}</button>
        <button class="btn btn-primary btn-sm" onclick="shareWhatsappMsg()">${mt('shareWhatsapp')}</button>
      </div>
    </div>`;
      }

      if (mk.formats.includes('poster')) {
        const styleColors = { traditional: 'var(--madder)', modern: 'var(--indigo)', premium: 'var(--ink)', festival: 'var(--turmeric)', story: 'var(--green)' };
        html += `<div class="mkt-result-card">
      <h3>🖼️ ${mt('poster')}</h3>
      <div class="poster-preview" style="background:${styleColors[mk.style] || 'var(--madder)'}">
        <img class="poster-bg" src="${product.dataUrl}" alt="" style="opacity:0.45;${imgStyle}">
        <div class="poster-tint"></div>
        <div class="poster-content">
          <div class="poster-tag">${escapeHtml(g.poster.tagline)}</div>
          <div class="poster-title">${escapeHtml(product.category)}</div>
          <div class="poster-price">₹${escapeHtml(product.price)}</div>
          <div class="poster-foot"><span>${artisanLine}</span><span>${mt('handmade')}</span></div>
        </div>
      </div>
      <div class="btn-row">
        <button class="btn btn-ghost btn-sm" onclick="downloadPoster()">${mt('downloadPoster')}</button>
        <button class="btn btn-primary btn-sm" onclick="sharePosterNow()">${mt('sharePoster')}</button>
      </div>
    </div>`;
      }

      html += `<div class="mkt-actions-footer">
    <button class="btn btn-ghost" onclick="regenerateContent()">${mt('regenerate')}</button>
  </div></div>`;
      return html;
    }

    function renderMarketingModal() {
      const mk = state.marketing;
      if (!mk || !mk.open || !mk.product) return '';
      const lang = mk.language;
      const product = mk.product;

      const formatDefs = [['social', '📱', mt('social')], ['whatsapp', '💬', mt('whatsapp')], ['poster', '🖼️', mt('poster')]];
      const styleDefs = ['traditional', 'modern', 'premium', 'festival', 'story'];
      const styleIcons = { traditional: '🌿', modern: '✨', premium: '👑', festival: '🎉', story: '❤️' };
      const audienceDefs = ['local', 'international', 'gift', 'homedecor', 'fashion', 'corporate'];
      const audienceIcons = { local: '🇮🇳', international: '🌎', gift: '🎁', homedecor: '🏠', fashion: '👗', corporate: '🏢' };
      const festivalDefs = ['diwali', 'christmas', 'onam', 'pongal', 'ugadi', 'eid', 'rakhi', 'wedding', 'housewarming', 'mothersday'];
      const langDefs = [['en', 'English'], ['hi', 'हिन्दी'], ['kn', 'ಕನ್ನಡ'], ['ta', 'தமிழ்'], ['te', 'తెలుగు'], ['ml', 'മലയാളം']];

      return `<div class="mkt-overlay" onclick="if(event.target===this) closeMarketing()">
    <div class="mkt-panel" role="dialog" aria-modal="true" aria-label="${mt('workspaceTitle')}">
      <div class="mkt-header">
        <h2>📢 ${mt('workspaceTitle')}</h2>
        <button class="mkt-close" onclick="closeMarketing()" aria-label="${mt('close')}">✕</button>
      </div>
      <div class="mkt-body">
        <div class="mkt-product-strip">
          <img src="${product.dataUrl}" alt="${escapeHtml(product.category)}">
          <div>
            <div class="mp-name">${escapeHtml(product.category)}</div>
            <div class="mp-meta">${product.craft ? escapeHtml(product.craft) + ' · ' : ''}₹${escapeHtml(product.price)}${product.location ? ' · ' + escapeHtml(product.location) : ''}${product.artisan ? ' · ' + escapeHtml(product.artisan) : ''}</div>
          </div>
        </div>

        <div class="mkt-section">
          <div class="mkt-section-title">${mt('whatCreate')}</div>
          <div class="mkt-grid">
            ${formatDefs.map(([id, icon, name]) => `
              <button class="mkt-choice ${mk.formats.includes(id) ? 'active' : ''}" onclick="toggleFormat('${id}')">
                <span class="mc-icon">${icon}</span>${name}
              </button>`).join('')}
          </div>
        </div>

        <div class="mkt-section">
          <div class="mkt-section-title">${mt('styleTitle')}</div>
          <div class="mkt-grid">
            ${styleDefs.map(s => `<button class="mkt-choice ${mk.style === s ? 'active' : ''}" onclick="selectStyle('${s}')"><span class="mc-icon">${styleIcons[s]}</span>${mktName('styles', s, lang)}</button>`).join('')}
          </div>
        </div>

        <div class="mkt-section">
          <div class="mkt-section-title">${mt('audienceTitle')}</div>
          <div class="mkt-grid">
            ${audienceDefs.map(a => `<button class="mkt-choice ${mk.audience === a ? 'active' : ''}" onclick="selectAudience('${a}')"><span class="mc-icon">${audienceIcons[a]}</span>${mktName('audiences', a, lang)}</button>`).join('')}
          </div>
        </div>

        <div class="mkt-section">
          <div class="mkt-section-title">${mt('festivalTitle')}</div>
          <div class="mkt-pill-row">
            <button class="mkt-pill ${!mk.festival ? 'active' : ''}" onclick="selectFestival(null)">${mt('festivalNone')}</button>
            ${festivalDefs.map(f => `<button class="mkt-pill ${mk.festival === f ? 'active' : ''}" onclick="selectFestival('${f}')">${mktName('festivals', f, lang)}</button>`).join('')}
          </div>
        </div>

        <div class="mkt-section">
          <div class="mkt-section-title">${mt('langTitle')}</div>
          <div class="mkt-lang-row">
            <select onchange="setMktLang(this.value)" aria-label="${mt('langTitle')}">
              ${langDefs.map(([code, label]) => `<option value="${code}" ${lang === code ? 'selected' : ''}>${label}</option>`).join('')}
            </select>
          </div>
        </div>

        <div class="mkt-section">
          <div class="mkt-section-title">${mt('photoTool')}</div>
          <div class="mkt-pill-row">
            <button class="mkt-pill ${mk.photo.lighting ? 'active' : ''}" onclick="togglePhotoOpt('lighting')">${mt('improveLighting')}</button>
            <button class="mkt-pill ${mk.photo.clean ? 'active' : ''}" onclick="togglePhotoOpt('clean')">${mt('cleanBackground')}</button>
            <button class="mkt-pill ${mk.photo.square ? 'active' : ''}" onclick="togglePhotoOpt('square')">${mt('squareFormat')}</button>
          </div>
        </div>

        <div class="mkt-section">
          <div class="mkt-section-title">${mt('noteLabel')}</div>
          <div style="display:flex; gap:0.6rem; align-items:flex-start">
            <textarea id="mkt-note" class="mkt-note" placeholder="${mt('notePlaceholder')}" oninput="state.marketing.note=this.value">${escapeHtml(mk.note || '')}</textarea>
            <button class="mic-btn ${mk.listening ? 'listening' : ''}" onclick="toggleVoiceInput()" aria-label="${mt('voice')}" title="${mt('voice')}">🎤</button>
          </div>
          ${mk.listening ? `<div class="ai-status"><span class="spinner"></span>${mt('listening')}</div>` : ''}
        </div>

        <button class="btn btn-primary mkt-generate-btn" onclick="generateContent()">${mt('generate')}</button>

        ${mk.generated ? renderMarketingResults(mk) : ''}
      </div>
    </div>
  </div>`;
    }

    function renderPromotionsHistory() {
      const lang = state.lang;
      const L = MKT_UI[lang] || MKT_UI.en;
      return `<div class="promo-history">
    <div class="gallery-title">${L.myPromotions}<span class="rule"></span></div>
    ${state.promotions.length === 0
      ? `<div class="empty-state">${stampSvg(40, 'var(--thread-line)')}<p>${L.noPromotions}</p></div>`
      : state.promotions.map(p => `
      <div class="promo-card">
        <img src="${p.dataUrl}" alt="${escapeHtml(p.productName)}">
        <div class="promo-info">
          <div class="pi-title">${escapeHtml(p.productName)}</div>
          <div class="pi-meta">${p.date} · ${p.types.map(tp => (L[tp] || tp)).join(', ')}${p.festival ? ' · ' + mktName('festivals', p.festival, lang) : ''}${p.shares ? ' · 📤 ' + p.shares : ''}</div>
        </div>
        <div class="promo-stats">
          <span>👁️ ${p.views}</span><span>🔗 ${p.clicks}</span><span>❤️ ${p.engagement}</span><span>🛒 ${p.orders}</span>
        </div>
        <button class="btn btn-ghost btn-sm" onclick="promoteAgain(${p.id})">${L.promoteAgain}</button>
      </div>
    `).join('')}
    ${state.promotions.length > 0 ? `<div class="promo-tip"><strong>${L.tipLabel}</strong> ${L.tipText}</div>` : ''}
  </div>`;
    }

    /* ============================= Render ============================= */
    const VIEWS = {
      landing: viewLanding,
      signup: viewSignup,
      login: viewLogin,
      home: viewHome,
      upload: viewUpload,
      orders: viewOrders,
      festival: viewFestival,
      apprenticeship: viewApprenticeship,
      thankyou: viewThankyou
    };

    function render() {
      applyHtmlAttrs();
      if (!state.user && !['landing', 'signup', 'login'].includes(state.view)) state.view = 'landing';
      const view = VIEWS[state.view] || viewLanding;
      document.getElementById('app').innerHTML = view() + `<div class="footer-note">${t('brand')} · ${t('eyebrow')}</div>`;
      document.getElementById('overlay').innerHTML = renderModal() + renderMarketingModal()
        + (state.toast ? `<div class="toast" role="status">${escapeHtml(state.toast)}</div>` : '');
      registerTtsClicks();
      if (state.view === 'thankyou') {
        setTimeout(() => { if (state.view === 'thankyou') go('home'); }, 4000);
      }
    }

    document.addEventListener('click', e => {
      if (state.panelOpen && !e.target.closest('.panel') && !e.target.closest('.icon-btn')) {
        setState({ panelOpen: false });
      }
      if (state.modal && e.target.classList && e.target.classList.contains('modal')) closeModal();
    });

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') {
        if (state.marketing && state.marketing.open) closeMarketing();
        else if (state.modal) closeModal();
        else if (state.panelOpen) setState({ panelOpen: false });
      }
    });

    /* ============================= Auth handlers ============================= */
    async function handleSignup(e) {
      e.preventDefault();
      const name = document.getElementById('su-name').value.trim();
      const dob = document.getElementById('su-dob').value;
      const contact = document.getElementById('su-contact').value.trim();
      const udid = document.getElementById('su-udid').value.trim();
      const gender = document.getElementById('su-gender').value;
      if (!name || !dob || !contact || !gender) { setState({ formError: t('fillRequired') }); return false; }

      const email = contact.includes('@') ? contact.toLowerCase() : contact;
      const user = { name, dob, contact, udid, gender, email };
      const products = DEMO_PRODUCTS.map(p => Object.assign({}, p));
      await storeSet('user:' + email, user);
      await storeSet('products:' + email, products);
      await storeSet('promotions:' + email, []);
      setState({ user, products, promotions: [], view: 'home', formError: '' });
      return false;
    }

    async function handleLogin(e) {
      e.preventDefault();
      const name = document.getElementById('li-name').value.trim();
      const email = document.getElementById('li-email').value.trim().toLowerCase();
      const user = await storeGet('user:' + email);
      if (!user || user.name.trim().toLowerCase() !== name.toLowerCase()) {
        setState({ formError: t('noAccount') });
        return false;
      }
      const products = await storeGet('products:' + email) || [];
      const promotions = await storeGet('promotions:' + email) || [];
      setState({ user, products, promotions, view: 'home', formError: '' });
      return false;
    }

    function handleLogout() {
      if (window.speechSynthesis) window.speechSynthesis.cancel();
      setState({
        user: null, products: [], promotions: [], view: 'landing', panelOpen: false,
        pending: null, aiStatus: 'idle', festivalCollection: [], voiceHeard: '', modal: null,
        marketing: Object.assign(defaultMarketing(null), { open: false, product: null })
      });
    }

    /* ============================= Init ============================= */
    render();
  </script>
</body>

</html>
